; PlatformIO Project Configuration File for ChairSense ESP8266
; NodeMCU v3 (LoLin / DOIT ESP-12E Module)

[env:nodemcuv3]
platform = espressif8266
board = nodemcuv2 ; Note: PlatformIO uses 'nodemcuv2' for all NodeMCU 1.0/v2/v3 (ESP-12E/F) boards
framework = arduino

; Board Configuration for NodeMCU v3 (ESP-12E / 4MB Flash)
board_build.mcu = esp8266
board_build.f_cpu = 80000000L
board_build.flash_mode = dio

; Serial Monitor & Upload Configuration
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
upload_speed = 921600
monitor_filters = 
    esp8266_exception_decoder
    time
    default

; Compiler Flags
build_flags = 
    -D BEARSSL_SSL_BASIC
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS

; Library Dependencies
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4